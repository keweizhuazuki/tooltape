name: regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  jdk-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - if: runner.os != 'Windows'
        run: ./build.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1
      - run: java -jar target/tooltape.jar validate fixtures/weather-retry.tape
      - run: java -jar target/tooltape.jar validate fixtures/weather-retry-v2.tape
      - run: java -jar target/tooltape.jar diff fixtures/weather-retry.tape fixtures/weather-retry.tape
  junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node viewer/test-core.cjs
      - run: node viewer/test-interactions.cjs
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify reproducible JAR and consumer CLI
        run: |
          ./build.sh
          mkdir -p target/dist
          cp target/tooltape.jar target/dist/tooltape-0.2.0.jar
          ./build.sh
          cmp target/tooltape.jar target/dist/tooltape-0.2.0.jar
          java -jar target/dist/tooltape-0.2.0.jar --version
          java -jar target/dist/tooltape-0.2.0.jar validate --json --require-v2 fixtures/weather-retry-v2.tape
          java -jar target/dist/tooltape-0.2.0.jar validate-batch --json fixtures/weather-retry.tape fixtures/weather-retry-v2.tape
          java -jar target/dist/tooltape-0.2.0.jar validate-batch --json --manifest examples/manifest/inventory.json
          cd target/dist
          sha256sum tooltape-0.2.0.jar > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tooltape-dist-${{ github.sha }}
          path: target/dist/
          if-no-files-found: error
          retention-days: 30
