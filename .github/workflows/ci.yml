name: regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  jdk-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - if: runner.os != 'Windows'
        run: ./build.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1
      - run: java -jar target/tooltape.jar validate fixtures/weather-retry.tape
      - run: java -jar target/tooltape.jar diff fixtures/weather-retry.tape fixtures/weather-retry.tape
  junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
