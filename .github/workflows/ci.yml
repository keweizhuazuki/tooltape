name: regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  jdk-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - if: runner.os != 'Windows'
        run: ./build.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1
      - run: java -jar target/tooltape.jar validate fixtures/weather-retry.tape
      - run: java -jar target/tooltape.jar validate fixtures/weather-retry-v2.tape
      - run: java -jar target/tooltape.jar diff fixtures/weather-retry.tape fixtures/weather-retry.tape
  junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node viewer/test-core.cjs
      - run: node viewer/test-interactions.cjs
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify reproducible JAR and consumer CLI
        run: |
          ./build.sh
          mkdir -p target/dist
          cp target/tooltape.jar target/dist/tooltape-0.2.0.jar
          ./build.sh
          cmp target/tooltape.jar target/dist/tooltape-0.2.0.jar
          java -jar target/dist/tooltape-0.2.0.jar --version
          java -jar target/dist/tooltape-0.2.0.jar validate fixtures/weather-retry-v2.tape
          cd target/dist
          sha256sum tooltape-0.2.0.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tooltape-dist-${{ github.sha }}
          path: target/dist/
          if-no-files-found: error
          retention-days: 30
